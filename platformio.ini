[platformio]
default_envs = xteink_x4

[base]
; pioarduino Arduino-ESP32 (Arduino core 3.3.x / ESP-IDF 5.5.x), as used by FreeInk/CrossPoint
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = esp32-c3-devkitm-1
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 7340032
board_build.partitions = partitions.csv
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -DUSE_UTF8_LONG_NAMES=1
  -DUSE_SPI_ARRAY_TRANSFER=1
  -DFREEINK_BOOK_SMALL=1
  ; glyph cache sizes must match in every compile unit (FreeInkBook's SMALL profile values)
  -DFREEINK_FONT_ADVANCE_SLOTS=256
  -DFREEINK_FONT_GLYPH_SLOTS=64
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=0
lib_deps =
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  FreeInkBook=symlink://freeink-sdk/libs/book/FreeInkBook
  FreeInkFont=symlink://freeink-sdk/libs/font/FreeInkFont
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  bblanchon/ArduinoJson@^7.2.0
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect

; Xteink X4 (ESP32-C3, SSD1677 800x480) only
[env:xteink_x4]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1

; Xteink X4 Classic (ESP32-S3, 8 MB PSRAM, buttons only; SSD1677/UC8179/UC8279 picked at boot)
[env:xteink_x4c]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.partitions = partitions.csv
build_flags =
  ${base.build_flags}
  -DBOARD_HAS_PSRAM
  ; SD is native SDMMC on this board; SdFat needs its block-device interface
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DFREEINK_DEVICE_X4CLASSIC=1
